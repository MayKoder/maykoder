<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADB5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#393E46;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="wireframeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADB5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EEEEEE;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00ADB5;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#222831;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Glow Effect -->
  <circle cx="300" cy="250" r="230" fill="url(#glowGradient)" />

  <!-- 3D Wireframe Cube -->
  <g id="wireframe" stroke="url(#wireframeGradient)" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Front face -->
    <path d="M200,150 L350,120 L350,270 L200,300 Z" />
    <!-- Back face -->
    <path d="M250,100 L400,70 L400,220 L250,250 Z" />
    <!-- Connecting edges -->
    <line x1="200" y1="150" x2="250" y2="100" />
    <line x1="350" y1="120" x2="400" y2="70" />
    <line x1="350" y1="270" x2="400" y2="220" />
    <line x1="200" y1="300" x2="250" y2="250" />
  </g>

  <!-- 3D Wireframe Sphere -->
  <g id="sphere" stroke="url(#wireframeGradient)" stroke-width="1.5" fill="none">
    <!-- Horizontal lines -->
    <ellipse cx="450" cy="270" rx="70" ry="25" transform="rotate(-10 450 270)" />
    <ellipse cx="450" cy="270" rx="70" ry="25" transform="rotate(30 450 270)" />
    <ellipse cx="450" cy="270" rx="70" ry="25" transform="rotate(70 450 270)" />
    
    <!-- Vertical lines -->
    <ellipse cx="450" cy="270" rx="25" ry="70" transform="rotate(-10 450 270)" />
    <ellipse cx="450" cy="270" rx="25" ry="70" transform="rotate(30 450 270)" />
    <ellipse cx="450" cy="270" rx="25" ry="70" transform="rotate(70 450 270)" />
  </g>

  <!-- Code Editor with Shader Code -->
  <g id="codeEditor">
    <rect x="50" y="150" width="200" height="220" rx="5" fill="#222831" stroke="#393E46" stroke-width="2" />
    
    <!-- Title Bar -->
    <rect x="50" y="150" width="200" height="25" rx="5" ry="5" fill="#393E46" />
    <text x="160" y="167" text-anchor="middle" fill="#EEEEEE" font-family="monospace" font-size="12">fragment.glsl</text>
    
    <!-- Code Lines -->
    <g font-family="monospace" font-size="10" fill="#EEEEEE">
      <text x="60" y="195">uniform vec2 u_resolution;</text>
      <text x="60" y="210">uniform float u_time;</text>
      <text x="60" y="225"></text>
      <text x="60" y="240" fill="#00ADB5">void main() {</text>
      <text x="60" y="255"><tspan fill="#999">  // Normalized coordinates</tspan></text>
      <text x="60" y="270">  vec2 uv = gl_FragCoord.xy</text>
      <text x="60" y="285">       / u_resolution.xy;</text>
      <text x="60" y="300"></text>
      <text x="60" y="315">  vec3 color = vec3(uv.x,</text>
      <text x="60" y="330">       uv.y, sin(u_time));</text>
      <text x="60" y="345"></text>
      <text x="60" y="360">  gl_FragColor = vec4(color, 1.0);</text>
      <text x="60" y="375" fill="#00ADB5">}</text>
    </g>
  </g>

  <!-- Floating Particle Effects -->
  <g id="particles">
    <circle cx="350" cy="150" r="3" fill="#00ADB5" opacity="0.8">
      <animate attributeName="cy" values="150;140;150" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="100" r="2" fill="#EEEEEE" opacity="0.6">
      <animate attributeName="cy" values="100;110;100" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="350" r="2.5" fill="#00ADB5" opacity="0.7">
      <animate attributeName="cy" values="350;340;350" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="200" r="3" fill="#EEEEEE" opacity="0.5">
      <animate attributeName="cy" values="200;210;200" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="400" r="2" fill="#00ADB5" opacity="0.6">
      <animate attributeName="cy" values="400;390;400" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Coordinate System -->
  <g id="coordinates" stroke="#393E46" stroke-width="1" opacity="0.7">
    <line x1="450" y1="320" x2="510" y2="320" stroke="#00ADB5" />
    <line x1="450" y1="320" x2="450" y2="260" stroke="#EEEEEE" />
    <line x1="450" y1="320" x2="420" y2="350" stroke="#393E46" />
    
    <text x="515" y="320" fill="#00ADB5" font-family="monospace" font-size="12">X</text>
    <text x="450" y="255" fill="#EEEEEE" font-family="monospace" font-size="12">Y</text>
    <text x="415" y="360" fill="#393E46" font-family="monospace" font-size="12">Z</text>
  </g>

  <!-- Mathematical Formulas -->
  <g id="math" font-family="monospace" font-size="12" fill="#EEEEEE">
    <text x="300" y="380">mat4 MVP = projection * view * model;</text>
    <text x="300" y="400">vec4 position = MVP * vec4(vertex, 1.0);</text>
  </g>
</svg> 